name: Deploy

# Pushes to main are linted and tested, then published to Hostinger over FTPS.
# A failing check blocks the deploy — `deploy` needs `verify` to pass first.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# Repository → Settings → Secrets and variables → Actions
#
#   Secrets (encrypted, never printed) — all three are required:
#     FTP_SERVER     ftp.your-domain.com   (hPanel → Files → FTP Accounts)
#     FTP_USERNAME   u123456789.deploy     (an FTP account, NOT your hPanel login)
#     FTP_PASSWORD   the FTP account password
#
#   Optional, accepted as either a Variable or a Secret:
#     FTP_REMOTE_DIR  where to publish, with a trailing slash (default public_html/)
#     FTP_PROTOCOL    'ftps' (default) or 'ftp' if the host has no working TLS
#
#   Variables only:
#     HEALTHCHECK_URL optional; e.g. https://kishanmodhu.com/ — checked after deploy
#
# ── Never deployed ──────────────────────────────────────────────────────────
# .env stays on the server and is never overwritten. public/assets/uploads/ is
# excluded so a deploy cannot delete media uploaded through the CMS. Neither
# database/ nor tests/ belong on a web host.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests (emergency only)'
        type: boolean
        default: false

# One deploy at a time. A newer push waits rather than interleaving uploads.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Match the PHP version configured in hPanel → Advanced → PHP Configuration.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd
          coverage: none

      - name: Lint every PHP file
        run: |
          find app config database public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run test suite
        if: ${{ !inputs.skip_tests }}
        run: php tests/run.php

      # Catches a stray .env or a credential pasted into tracked source.
      # Note: git grep only sees tracked files, which is what we want here —
      # the question is what has been committed, not what is on disk.
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -qxF '.env'; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi

          # Documentation legitimately shows "DB_PASSWORD=your-db-password" and
          # the like, so obvious placeholders are filtered out rather than the
          # whole file being skipped — a real password pasted into the README
          # should still fail the build.
          hits=$(git grep -nEi 'DB_PASSWORD[[:space:]]*=[[:space:]]*[^[:space:]]+' \
                   -- ':!.env.example' ':!.github' || true)

          if [ -n "$hits" ]; then
            real=$(printf '%s\n' "$hits" | grep -vEi \
              '=[[:space:]]*(your[-_.]|my[-_.]|the[-_.]|change[-_.]?me|password[-_.]?here|secret[-_.]?here|placeholder|example|dummy|test|x{3,}|\*{3,}|<[^>]+>|\$\{|"?\$)' \
              || true)

            if [ -n "$real" ]; then
              echo "$real"
              echo "::error::A database password looks hard-coded in tracked source."
              exit 1
            fi

            echo "Ignored $(printf '%s\n' "$hits" | wc -l) documented placeholder(s)."
          fi

  deploy:
    name: Publish to Hostinger
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Validates the shape of the credentials without printing them. A stray
      # newline pasted into a secret is invisible in the GitHub UI and is a
      # common cause of "530 Login incorrect".
      - name: Preflight — inspect credentials
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || secrets.FTP_REMOTE_DIR }}
        run: |
          fail=0

          for key in SERVER USERNAME PASSWORD; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              echo "::error::Secret FTP_${key} is not set."
              fail=1
            fi
          done

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          # A hostname or FTP username never contains whitespace, so any is an error.
          for key in SERVER USERNAME; do
            eval "value=\${$key}"
            stripped=$(printf '%s' "$value" | tr -d '[:space:]')
            if [ "${#value}" -ne "${#stripped}" ]; then
              echo "::error::FTP_${key} contains a space, tab or newline. Re-paste it with no surrounding whitespace."
              fail=1
            fi
          done

          # A password may legitimately contain an internal space, so only
          # surrounding whitespace and embedded newlines are rejected.
          trimmed=$(printf '%s' "$PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$PASSWORD" != "$trimmed" ]; then
            echo "::error::FTP_PASSWORD has leading or trailing whitespace. Re-paste it without it."
            fail=1
          fi
          if [ "$(printf '%s' "$PASSWORD" | wc -l)" -gt 0 ]; then
            echo "::error::FTP_PASSWORD contains a newline. Re-paste it as a single line."
            fail=1
          fi

          echo "FTP_SERVER   ${#SERVER} chars"
          echo "FTP_USERNAME ${#USERNAME} chars"
          echo "FTP_PASSWORD ${#PASSWORD} chars"

          case "$SERVER" in
            *://*)
              echo "::error::FTP_SERVER must be a bare hostname or IP — drop the ftp:// prefix."
              fail=1 ;;
            */*)
              echo "::error::FTP_SERVER must not include a path. Put the directory in the FTP_REMOTE_DIR variable."
              fail=1 ;;
          esac

          case "$USERNAME" in
            *@*)
              echo "::warning::FTP_USERNAME looks like an email address. Hostinger FTP usernames look like u123456789 — it is not your hPanel login." ;;
          esac

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          # An IP literal needs no lookup at all. Note that `getent hosts <ip>`
          # would do a *reverse* lookup and report failure for any address
          # without a PTR record — which most hosting IPs lack.
          case "$SERVER" in
            *[!0-9.]*)
              is_literal=0 ;;
            *.*.*.*)
              is_literal=1 ;;
            *)
              is_literal=0 ;;
          esac

          case "$SERVER" in
            *:*) is_literal=1 ;;
          esac

          if [ "$is_literal" -eq 1 ]; then
            echo "FTP_SERVER is an IP literal; no DNS lookup needed."
          elif getent ahosts "$SERVER" > /dev/null 2>&1; then
            echo "FTP_SERVER resolves to: $(getent ahosts "$SERVER" | awk '{print $1}' | sort -u | paste -sd' ')"
          else
            echo "::error::FTP_SERVER does not resolve. Use the host or IP shown in hPanel → Files → FTP Accounts. (The value is masked in this log; check it in repository settings.)"
            exit 1
          fi
          echo "Publishing to: ${REMOTE_DIR:-public_html/}"

          case "${REMOTE_DIR:-public_html/}" in
            */) : ;;
            *) echo "::warning::FTP_REMOTE_DIR has no trailing slash; the action expects one." ;;
          esac

      # Proves the credentials work before the upload action runs, and separates
      # an authentication failure from a TLS or connectivity one.
      - name: Preflight — test login
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROTOCOL: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
        run: |
          umask 077
          netrc="${RUNNER_TEMP}/ftp-netrc"
          printf 'machine %s login %s password %s\n' "$SERVER" "$USERNAME" "$PASSWORD" > "$netrc"
          trap 'rm -f "$netrc"' EXIT

          probe() {
            curl -sS --connect-timeout 20 --max-time 60 \
                 --netrc-file "$netrc" $1 --list-only "ftp://${SERVER}/" 2>&1
          }

          # Plain FTP explicitly requested — verify that and stop.
          if [ "$PROTOCOL" = "ftp" ]; then
            if listing=$(probe ''); then
              echo "Plain FTP login succeeded. Remote root contains:"
              printf '%s\n' "$listing" | head -20
              echo "::warning::FTP_PROTOCOL is 'ftp', so the password crosses the network unencrypted. Prefer FTPS — see the deployment notes in README.md."
              exit 0
            fi
            printf '%s\n' "$listing"
            echo "::error::Plain FTP login failed. Check FTP_USERNAME and FTP_PASSWORD in hPanel → Files → FTP Accounts."
            exit 1
          fi

          # Best case: FTPS with a fully valid certificate.
          if listing=$(probe --ssl-reqd); then
            echo "FTPS login succeeded with a valid certificate. Remote root contains:"
            printf '%s\n' "$listing" | head -20
            exit 0
          fi
          strict="$listing"

          # Does TLS work at all, ignoring certificate identity? The upload
          # action does not verify certificates, so this is the behaviour that
          # actually matters — being stricter here would block a working deploy.
          if listing=$(probe '--ssl-reqd --insecure'); then
            echo "FTPS works, but the certificate does not match the host:"
            printf '%s\n' "$strict" | head -5
            echo
            echo "::warning::Connecting by IP address cannot match the server's certificate. The transfer is still encrypted and the upload will proceed. To silence this, set FTP_SERVER to the FTP hostname from hPanel instead of the IP."
            echo "Remote root contains:"
            printf '%s\n' "$listing" | head -20
            exit 0
          fi

          echo "FTPS attempt failed:"
          printf '%s\n' "$strict"

          if listing=$(probe ''); then
            echo "::error::TLS is unavailable on this server, but plain FTP works. Set the repository VARIABLE (not secret) FTP_PROTOCOL to 'ftp' to deploy without encryption."
            exit 1
          fi

          case "$strict$listing" in
            *530*)
              echo "::error::530 Login incorrect — the server rejected this username/password pair. Check them against hPanel → Files → FTP Accounts (an FTP account, not your hPanel login)." ;;
            *timed\ out*|*Timeout*)
              echo "::error::Connection timed out. Confirm FTP_SERVER and that the host is not blocking the runner." ;;
            *)
              echo "::error::Could not establish an FTP session. Output above." ;;
          esac

          exit 1

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || secrets.FTP_REMOTE_DIR || 'public_html/' }}
          # Only files that changed since the last run are transferred; the
          # action keeps its own state file on the server to work that out.
          state-name: .ftp-deploy-sync-state.json
          # Anything matched here is neither uploaded nor deleted remotely.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/database/**
            **/node_modules/**
            **/.env
            **/.env.example
            **/*.md
            **/storage/logs/*.log
            **/public/assets/uploads/**
            **/.DS_Store

      # Proves where the files actually landed. An FTP account that is chrooted
      # into the web root will already be "inside" public_html, in which case a
      # server-dir of public_html/ silently nests them one level too deep.
      - name: Confirm the upload landed
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || secrets.FTP_REMOTE_DIR || 'public_html/' }}
        run: |
          umask 077
          netrc="${RUNNER_TEMP}/ftp-netrc"
          printf 'machine %s login %s password %s\n' "$SERVER" "$USERNAME" "$PASSWORD" > "$netrc"
          trap 'rm -f "$netrc"' EXIT

          list() {
            curl -sS --connect-timeout 20 --max-time 60 --netrc-file "$netrc" \
                 --ssl-reqd --insecure --list-only "ftp://${SERVER}/${1}" 2>/dev/null || true
          }

          target="${REMOTE_DIR%/}/"

          echo "── FTP login directory (/) ──"
          root=$(list '')
          printf '%s\n' "$root" | sed 's/^/  /'

          echo
          echo "── Deploy target (${target}) ──"
          landed=$(list "$target")
          printf '%s\n' "$landed" | sed 's/^/  /'

          echo
          if printf '%s\n' "$landed" | grep -qx 'index.php'; then
            echo "index.php is present in ${target} — the upload landed correctly."
          elif printf '%s\n' "$root" | grep -qx 'index.php'; then
            echo "::error::index.php is in the FTP login directory, not ${target}. This account is already chrooted to the web root — set FTP_REMOTE_DIR to './' (or delete it) so files are not nested."
            exit 1
          else
            echo "::warning::index.php was not found in ${target} or in the login directory. Compare the two listings above and set FTP_REMOTE_DIR to the directory your domain actually serves."
          fi

          if printf '%s\n' "$landed" | grep -qx 'public'; then
            echo "The application's public/ directory is present."
            echo "Point the domain's document root at ${target}public — or rely on the root .htaccess to rewrite into it."
          fi

      - name: Verify the site responds
        if: ${{ vars.HEALTHCHECK_URL != '' }}
        run: |
          url="${{ vars.HEALTHCHECK_URL }}"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url did not return 200 after the deploy."
          exit 1

name: Deploy

# Pushes to main are linted and tested, then published to Hostinger over FTPS.
# A failing check blocks the deploy — `deploy` needs `verify` to pass first.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# Repository → Settings → Secrets and variables → Actions
#
#   Secrets (encrypted, never printed):
#     FTP_SERVER     ftp.your-domain.com   (hPanel → Files → FTP Accounts)
#     FTP_USERNAME   u123456789.deploy
#     FTP_PASSWORD   the FTP account password
#
#   Variables (plain text, safe to read):
#     FTP_REMOTE_DIR  where to publish, with a trailing slash. See README.
#                     Default below suits "everything inside public_html".
#     HEALTHCHECK_URL optional; e.g. https://kishanmodhu.com/ — checked after deploy
#
# ── Never deployed ──────────────────────────────────────────────────────────
# .env stays on the server and is never overwritten. public/assets/uploads/ is
# excluded so a deploy cannot delete media uploaded through the CMS. Neither
# database/ nor tests/ belong on a web host.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests (emergency only)'
        type: boolean
        default: false

# One deploy at a time. A newer push waits rather than interleaving uploads.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Match the PHP version configured in hPanel → Advanced → PHP Configuration.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd
          coverage: none

      - name: Lint every PHP file
        run: |
          find app config database public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run test suite
        if: ${{ !inputs.skip_tests }}
        run: php tests/run.php

      # Catches a stray .env or a credential pasted into tracked source.
      # Note: git grep only sees tracked files, which is what we want here —
      # the question is what has been committed, not what is on disk.
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -qxF '.env'; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi

          # Documentation legitimately shows "DB_PASSWORD=your-db-password" and
          # the like, so obvious placeholders are filtered out rather than the
          # whole file being skipped — a real password pasted into the README
          # should still fail the build.
          hits=$(git grep -nEi 'DB_PASSWORD[[:space:]]*=[[:space:]]*[^[:space:]]+' \
                   -- ':!.env.example' ':!.github' || true)

          if [ -n "$hits" ]; then
            real=$(printf '%s\n' "$hits" | grep -vEi \
              '=[[:space:]]*(your[-_.]|my[-_.]|the[-_.]|change[-_.]?me|password[-_.]?here|secret[-_.]?here|placeholder|example|dummy|test|x{3,}|\*{3,}|<[^>]+>|\$\{|"?\$)' \
              || true)

            if [ -n "$real" ]; then
              echo "$real"
              echo "::error::A database password looks hard-coded in tracked source."
              exit 1
            fi

            echo "Ignored $(printf '%s\n' "$hits" | wc -l) documented placeholder(s)."
          fi

  deploy:
    name: Publish to Hostinger
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Validates the shape of the credentials without printing them. A stray
      # newline pasted into a secret is invisible in the GitHub UI and is a
      # common cause of "530 Login incorrect".
      - name: Preflight — inspect credentials
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          fail=0

          for key in SERVER USERNAME PASSWORD; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              echo "::error::Secret FTP_${key} is not set."
              fail=1
            fi
          done

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          # A hostname or FTP username never contains whitespace, so any is an error.
          for key in SERVER USERNAME; do
            eval "value=\${$key}"
            stripped=$(printf '%s' "$value" | tr -d '[:space:]')
            if [ "${#value}" -ne "${#stripped}" ]; then
              echo "::error::FTP_${key} contains a space, tab or newline. Re-paste it with no surrounding whitespace."
              fail=1
            fi
          done

          # A password may legitimately contain an internal space, so only
          # surrounding whitespace and embedded newlines are rejected.
          trimmed=$(printf '%s' "$PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$PASSWORD" != "$trimmed" ]; then
            echo "::error::FTP_PASSWORD has leading or trailing whitespace. Re-paste it without it."
            fail=1
          fi
          if [ "$(printf '%s' "$PASSWORD" | wc -l)" -gt 0 ]; then
            echo "::error::FTP_PASSWORD contains a newline. Re-paste it as a single line."
            fail=1
          fi

          echo "FTP_SERVER   ${#SERVER} chars"
          echo "FTP_USERNAME ${#USERNAME} chars"
          echo "FTP_PASSWORD ${#PASSWORD} chars"

          case "$SERVER" in
            *://*)
              echo "::error::FTP_SERVER must be a bare hostname or IP — drop the ftp:// prefix."
              fail=1 ;;
            */*)
              echo "::error::FTP_SERVER must not include a path. Put the directory in the FTP_REMOTE_DIR variable."
              fail=1 ;;
          esac

          case "$USERNAME" in
            *@*)
              echo "::warning::FTP_USERNAME looks like an email address. Hostinger FTP usernames look like u123456789 — it is not your hPanel login." ;;
          esac

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          if ! getent hosts "$SERVER" > /dev/null 2>&1; then
            echo "::error::${SERVER} does not resolve. Use the host or IP shown in hPanel → Files → FTP Accounts."
            exit 1
          fi

          echo "Resolves to: $(getent hosts "$SERVER" | awk '{print $1}' | sort -u | paste -sd' ')"

      # Proves the credentials work before the upload action runs, and separates
      # an authentication failure from a TLS or connectivity one.
      - name: Preflight — test login
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          umask 077
          netrc="${RUNNER_TEMP}/ftp-netrc"
          printf 'machine %s login %s password %s\n' "$SERVER" "$USERNAME" "$PASSWORD" > "$netrc"
          trap 'rm -f "$netrc"' EXIT

          probe() {
            curl -sS --connect-timeout 20 --max-time 60 \
                 --netrc-file "$netrc" $1 --list-only "ftp://${SERVER}/" 2>&1
          }

          if secure=$(probe --ssl-reqd); then
            echo "FTPS login succeeded. Remote root contains:"
            printf '%s\n' "$secure" | head -20
            exit 0
          fi

          echo "FTPS attempt failed:"
          printf '%s\n' "$secure"

          if plain=$(probe ''); then
            echo "::error::Plain FTP works but FTPS does not. Set the repository variable FTP_PROTOCOL to 'ftp', or enable FTPS on the hosting account."
            exit 1
          fi

          case "$secure$plain" in
            *530*)
              echo "::error::530 Login incorrect — the server rejected this username/password pair. Check FTP_USERNAME and FTP_PASSWORD against hPanel → Files → FTP Accounts (an FTP account, not your hPanel login), and re-paste with no trailing spaces." ;;
            *timed\ out*|*Timeout*)
              echo "::error::Connection timed out. Confirm FTP_SERVER and that the host is not blocking the runner." ;;
            *)
              echo "::error::Could not establish an FTP session. Output above." ;;
          esac

          exit 1

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || 'public_html/' }}
          # Only files that changed since the last run are transferred; the
          # action keeps its own state file on the server to work that out.
          state-name: .ftp-deploy-sync-state.json
          # Anything matched here is neither uploaded nor deleted remotely.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/database/**
            **/node_modules/**
            **/.env
            **/.env.example
            **/*.md
            **/storage/logs/*.log
            **/public/assets/uploads/**
            **/.DS_Store

      - name: Verify the site responds
        if: ${{ vars.HEALTHCHECK_URL != '' }}
        run: |
          url="${{ vars.HEALTHCHECK_URL }}"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url did not return 200 after the deploy."
          exit 1
